server:
  port: 8880

spring:
  datasource:
    url: jdbc:h2:mem:autoerddb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false   # 개발/테스트 환경(H2)에서는 비활성. 프로덕션(MySQL)은 spring.flyway.enabled=true 환경변수로 활성화
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 5MB
      resolve-lazily: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:latest
        options:
          temperature: 0.1
          num-predict: 2048
          # 컨텍스트 윈도우 명시. 미설정 시 Ollama 기본값(보통 2048~4096)이 적용되어
          # 대형 스키마 DDL이 컨텍스트를 초과해도 앞쪽 토큰이 조용히 잘려 환각/오답이 증가한다.
          # 50테이블(평균 80~150 토큰/테이블) 시나리오까지는 8192가 안전 하한.
          # 메모리 여유가 있고 100+ 테이블을 다룬다면 16384까지 확장 가능.
          num-ctx: 8192
          # 응답 완료 즉시 모델 언로드(메모리 해제). 단점: 2단계 호출 시
          # Step1 → Step2 사이에 9.6GB 모델 재로드 비용(SSD 기준 수~십수 초)이 발생한다.
          # 연속 호출이 잦은 운영 환경에서는 "2m" 권장. 본 값은 환경별로 재정의 가능.
          keep-alive: "0"

logging:
  level:
    com.autoerd: DEBUG
    org.springframework.web: DEBUG
