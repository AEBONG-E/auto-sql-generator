server:
  port: 8880

spring:
  profiles:
    active: local   # 기본 프로파일. 운영 배포 시 prod로 변경
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 5MB
      resolve-lazily: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:latest
        options:
          temperature: 0.1
          num-predict: 2048
          keep-alive: "0"  # 응답 완료 즉시 모델 언로드 (메모리 해제)

logging:
  level:
    com.autoerd: DEBUG
    org.springframework.web: DEBUG

---
# local / test 프로파일 — H2 인메모리 DB (개발/테스트 환경)
spring:
  config:
    activate:
      on-profile: "local,test"
  datasource:
    url: jdbc:h2:mem:autoerddb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

---
# prod 프로파일 — MySQL 8.0+ + Flyway (운영 환경)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
