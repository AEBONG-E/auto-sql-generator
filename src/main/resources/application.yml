server:
  port: 8880

spring:
  profiles:
    active: local   # 기본 프로파일. 운영 배포 시 prod로 변경
  mvc:
    async:
      # SSE(Flux<String>) 응답은 Servlet 비동기 디스패치를 사용한다. 미설정 시 컨테이너(Tomcat)
      # 기본 타임아웃(수십 초)이 적용되어, 대형 스키마 DDL + LLM 생성 시간이 이를 초과하면
      # 스트림이 중간에 끊긴다. LLM 생성 편차를 감안해 넉넉히 설정.
      request-timeout: 180000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 5MB
      resolve-lazily: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:latest
        options:
          temperature: 0.1
          num-predict: 2048
          # 컨텍스트 윈도우 명시. 미설정 시 Ollama 기본값(보통 2048~4096)이 적용되어
          # 대형 스키마 DDL이 컨텍스트를 초과해도 앞쪽 토큰이 조용히 잘려 환각/오답이 증가한다.
          # 50테이블(평균 80~150 토큰/테이블) 시나리오까지는 8192가 안전 하한.
          # 메모리 여유가 있고 100+ 테이블을 다룬다면 16384까지 확장 가능.
          num-ctx: 8192
          # 2단계 LLM 호출(Step1 테이블 매핑 → Step2 SQL 생성) 사이의 9.6GB 모델 재로드
          # 비용(SSD 기준 수~십수 초)을 제거하기 위해 "5m" 유지. 응답 완료 후 5분간 모델을
          # 메모리에 보존하다가 idle 시 자동 언로드. 메모리 압박이 큰 환경에서는 "0"로 축소.
          keep-alive: "5m"

# 앱 기동 완료 후 gemma4 모델을 백그라운드로 프리로드(warm-up)하여 첫 요청의 콜드 스타트를 제거.
# 비블로킹·실패 격리 구현(com.autoerd.config.ModelWarmupRunner). Ollama가 없는 로컬/CI에서는
# enabled: false로 끌 수 있다. (기존 2단계 LLM 경로와 num-ctx/keep-alive 설정에는 영향 없음)
app:
  llm:
    warmup:
      enabled: true
      prompt: "ping"
    # Step1(테이블 매핑) 전 후보 사전 축소(pre-filter) — 대형 스키마에서 Step1 프롬프트 크기를 낮춰 지연 감소.
    # 결정적(비-LLM) 키워드 스코어링(com.autoerd.service.TableCandidatePrefilter). 최종 선별은 여전히
    # LLM + validNames 필터가 담당. min-tables 이하이거나 매칭 0건이면 전체를 그대로 넘겨 회귀를 방지한다.
    prefilter:
      enabled: true
      min-tables: 30       # 테이블 수가 이 값 이하이면 미적용(소형 스키마 회귀 방지)
      max-candidates: 40   # Step1에 넘길 최대 후보 테이블 수 (QA 실측 반영: 30→40 안전마진 상향)
      # 한글 질의 용어 → 영문 식별자 토큰 동의어 사전. 한글("지점")이 영문 테이블명(branch)에
      # 매칭되지 않아 관련 테이블이 밀리는 문제(QA Q1) 보완. 코드 기본값(PrefilterProperties)에
      # 도메인 공통어가 시드되어 있고, 아래처럼 프로젝트별 용어를 추가/재정의할 수 있다(병합됨).
      # synonyms:
      #   출고: "release dispatch"
      #   반품: "return refund"

logging:
  level:
    com.autoerd: DEBUG
    org.springframework.web: DEBUG

---
# local / test 프로파일 — H2 인메모리 DB (개발/테스트 환경)
spring:
  config:
    activate:
      on-profile: "local,test"
  datasource:
    url: jdbc:h2:mem:autoerddb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

---
# prod 프로파일 — MySQL 8.0+ + Flyway (운영 환경)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
