server:
  port: 8880

spring:
  profiles:
    active: local   # 기본 프로파일. 운영 배포 시 prod로 변경
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 5MB
      resolve-lazily: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4:latest
        options:
          temperature: 0.1
          num-predict: 2048
          # 컨텍스트 윈도우 명시. 미설정 시 Ollama 기본값(보통 2048~4096)이 적용되어
          # 대형 스키마 DDL이 컨텍스트를 초과해도 앞쪽 토큰이 조용히 잘려 환각/오답이 증가한다.
          # 50테이블(평균 80~150 토큰/테이블) 시나리오까지는 8192가 안전 하한.
          # 메모리 여유가 있고 100+ 테이블을 다룬다면 16384까지 확장 가능.
          num-ctx: 8192
          # 2단계 LLM 호출(Step1 테이블 매핑 → Step2 SQL 생성) 사이의 9.6GB 모델 재로드
          # 비용(SSD 기준 수~십수 초)을 제거하기 위해 "5m" 유지. 응답 완료 후 5분간 모델을
          # 메모리에 보존하다가 idle 시 자동 언로드. 메모리 압박이 큰 환경에서는 "0"로 축소.
          keep-alive: "5m"

logging:
  level:
    com.autoerd: DEBUG
    org.springframework.web: DEBUG

---
# local / test 프로파일 — H2 인메모리 DB (개발/테스트 환경)
spring:
  config:
    activate:
      on-profile: "local,test"
  datasource:
    url: jdbc:h2:mem:autoerddb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

---
# prod 프로파일 — MySQL 8.0+ + Flyway (운영 환경)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
