plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.autoerd'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

ext {
	set('springAiVersion', '1.0.0')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Apache POI — 엑셀 파싱
	implementation 'org.apache.poi:poi-ooxml:5.3.0'

	// Jackson — JSON 직렬화
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Spring AI — Ollama (local LLM)
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

	// MySQL 프로덕션 DB
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Flyway — DB 마이그레이션
	implementation 'org.flywaydb:flyway-mysql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// H2 — local 개발 런타임(bootRun) 및 테스트 전용. developmentOnly는 bootJar(prod 아티팩트)에서 제외되어 MySQL 운영 환경을 오염시키지 않는다.
	developmentOnly 'com.h2database:h2'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ── Frontend (Vite + React) — 빌드 산출물을 src/main/resources/static로 직접 출력하여
// Spring Boot 정적 리소스로 서빙한다. bootJar/bootRun 전에 항상 최신 번들이 포함되도록
// processResources가 npmBuild에 의존한다.
def npmExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	group = 'frontend'
	workingDir = file('frontend')
	commandLine npmExecutable, 'ci'
	inputs.file('frontend/package-lock.json')
	outputs.dir('frontend/node_modules')
}

tasks.register('npmBuild', Exec) {
	group = 'frontend'
	dependsOn tasks.named('npmInstall')
	workingDir = file('frontend')
	commandLine npmExecutable, 'run', 'build'
	inputs.dir('frontend/src')
	inputs.file('frontend/index.html')
	inputs.file('frontend/vite.config.ts')
	outputs.dir('src/main/resources/static')
}

tasks.named('processResources') {
	dependsOn tasks.named('npmBuild')
}
